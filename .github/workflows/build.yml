name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Forge 1.8.9 jar
        run: ./gradlew -Pceleritas_target_versions=1.8.9 :forge189:packageJar
      - uses: actions/upload-artifact@v4
        with:
          name: ionium-forge-1.8.9
          path: build/libs/ionium/*.jar
