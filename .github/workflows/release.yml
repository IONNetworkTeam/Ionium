name: release

# Push a tag like v0.1.0 or v0.1.0-pre.1. Tags with a "-" become pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Forge 1.8.9 jar
        run: ./gradlew -Pceleritas_target_versions=1.8.9 -Pionium_version="${GITHUB_REF_NAME#v}" :forge189:packageJar
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=".github/release-notes/default.md"
          sha256sum build/libs/ionium/*.jar
          gh release create "$GITHUB_REF_NAME" build/libs/ionium/*.jar \
            --title "Ionium $version" --notes-file "$notes" --verify-tag $prerelease
